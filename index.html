<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="EV Trailer">
<title>EV Trailer</title>
<link rel="icon" href="ev-trailer-logo.png" type="image/png">
<link rel="apple-touch-icon" href="ev-trailer-logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css" integrity="sha256-YU3qCpj/P06tdPBJGPax0bm6Q1wltfwjsho5TR4+TYc=" crossorigin="">
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css" integrity="sha256-YSWCMtmNZNwqex4CEw1nQhvFub2lmU7vcCKP+XVwwXA=" crossorigin="">
<style>
:root {
  --bg:#0f1419; --panel:#1a2332; --text:#f4f7fb; --muted:#b7c2d0; --border:#3a4a5f;
  --blue:#2f6fed; --yellow:#e6b800; --green:#1f9d55; --danger:#e85d5d; --warn:#e6b800; --ok:#1f9d55;
  --radius:12px; --font:"Atkinson Hyperlegible","Segoe UI",system-ui,sans-serif; --base:18px;
}
*{box-sizing:border-box} html,body{min-height:100%;margin:0}
body{font-family:var(--font);font-size:var(--base);line-height:1.45;color:var(--text);background:var(--bg);display:flex;flex-direction:column}
button,input,select,textarea{font:inherit}
button{cursor:pointer;border:2px solid var(--border);background:var(--panel);color:var(--text);border-radius:10px;padding:.55rem .85rem;min-height:44px}
button:active{transform:scale(.98)}
button.primary{background:var(--blue);border-color:#1e4fbf;color:#fff;font-weight:700}
button.color-blue{background:var(--blue);border-color:#1e4fbf;color:#fff}
button.color-yellow{background:var(--yellow);border-color:#b38a00;color:#111}
button.color-green{background:var(--green);border-color:#147a3f;color:#fff}
button:disabled{opacity:.55;cursor:wait}
#topbar,#searchbar,#settings{display:flex;flex-wrap:wrap;gap:.5rem;align-items:center;padding:.55rem .75rem;border-bottom:2px solid var(--border);z-index:1000}
#topbar{background:var(--panel)} #searchbar{background:#121821;z-index:999}
#settings{background:#0f1419;display:none;align-items:flex-end}
#settings.open{display:flex}
#topbar h1{font-size:1.15rem;margin:0 .5rem 0 0;font-weight:700}
#topbar .grow{flex:1 1 auto}
.field{display:flex;flex-direction:column;gap:.2rem;min-width:110px}
.field label{font-size:.9rem;color:var(--muted);font-weight:700}
.field input[type=number],.field input[type=text],#searchbar input[type=text],#searchbar select{
  min-height:44px;background:#0f1419;color:var(--text);border:2px solid var(--border);border-radius:10px;padding:.45rem .65rem;width:100%
}
.toggle{display:flex;align-items:center;gap:.45rem;min-height:44px;font-weight:700}
#route-summary{display:none;width:100%;padding:.45rem .15rem .1rem;font-size:1.1rem;font-weight:700}
#route-summary.show{display:block}
#route-summary .muted{color:var(--muted);font-weight:400;font-size:.95rem}
#main{flex:0 0 auto;width:100%;display:flex;flex-flow:row wrap;align-items:flex-start;position:relative}
#map-stage{position:relative;flex:0 0 auto;width:min(100%,100vh);width:min(100%,100dvh);max-width:100%}
#map{width:100%;aspect-ratio:1/1;height:auto;background:#0c1218}
#detour-panel{display:none;flex:1 1 280px;width:min(440px,100%);min-width:min(100%,280px);max-height:100vh;max-height:100dvh;background:var(--panel);border-left:2px solid var(--border);overflow:auto;flex-direction:column}
#detour-panel.show{display:flex}
#detour-panel header{position:sticky;top:0;background:var(--panel);border-bottom:2px solid var(--border);padding:.65rem .75rem;z-index:2}
#detour-panel header h2{margin:0 0 .35rem;font-size:1.15rem}
#detour-filters{display:flex;flex-wrap:wrap;gap:.4rem;margin:.35rem 0}
#detour-list{list-style:none;margin:0;padding:.4rem .55rem 1rem}
#detour-list li{border:2px solid var(--border);border-radius:12px;padding:.65rem .75rem;margin:.45rem 0;background:#121821;cursor:pointer}
#detour-list .row1{display:flex;align-items:center;gap:.5rem;font-weight:700;font-size:1.05rem}
#detour-list .row2{color:var(--muted);margin-top:.25rem}
#detour-list .added{color:#ffe08a;font-weight:700;font-size:1.1rem;white-space:nowrap;margin-left:auto}
#detour-list .trailer{font-weight:700;margin-top:.3rem}
#detour-list .trailer.yes{color:#7dffa8} #detour-list .trailer.maybe{color:#ffe08a} #detour-list .trailer.no{color:var(--muted)}
#detour-list .range-flag{display:inline-block;margin-top:.35rem;padding:.25rem .55rem;border-radius:999px;font-weight:700;border:2px solid var(--border)}
#detour-list .range-flag.ok{background:#143d28;color:#7dffa8;border-color:#1f9d55}
#detour-list .range-flag.tight{background:#3d3410;color:#ffe08a;border-color:#e6b800}
#detour-list .range-flag.oor{background:#3d1515;color:#ffb4b4;border-color:#e85d5d}
#detour-list .note-line{margin-top:.3rem;color:#cde4ff;font-weight:700}
#detour-loading,#detour-error{padding:.75rem;color:var(--muted)} #detour-error{color:#ffb4b4}
#pick-banner{display:none;position:absolute;left:50%;top:12px;transform:translateX(-50%);z-index:1100;background:#243044;border:2px solid var(--border);padding:.55rem .85rem;border-radius:12px;font-weight:700;max-width:92%;text-align:center}
#pick-banner.show{display:block}
#legend{display:flex;flex-wrap:wrap;gap:.65rem;align-items:center;padding:.55rem .75rem;background:var(--panel);border-top:2px solid var(--border);font-size:.95rem}
.swatch{display:inline-flex;align-items:center;gap:.4rem;padding:.35rem .55rem;border-radius:999px;border:2px solid var(--border);background:#121821;user-select:none}
.swatch input{width:1.15rem;height:1.15rem}
.dot{width:14px;height:14px;border-radius:50%;display:inline-block;border:2px solid #fff;flex:0 0 auto}
.dot.blue{background:var(--blue)} .dot.yellow{background:var(--yellow)} .dot.green{background:var(--green)}
#status{color:var(--muted);font-size:.9rem;margin-left:.25rem}
.leaflet-popup-content-wrapper,.leaflet-popup-tip{background:var(--panel);color:var(--text);border-radius:var(--radius);box-shadow:0 8px 28px rgba(0,0,0,.45)}
.leaflet-popup-content{margin:.85rem 1rem;font-size:1rem;line-height:1.4;min-width:240px;max-width:320px}
.popup-title{font-size:1.15rem;font-weight:700;margin:0 0 .35rem}
.popup-address{display:block;font-size:1.15rem;font-weight:700;line-height:1.35;color:var(--text);text-decoration:underline;text-underline-offset:3px;margin:.25rem 0 .55rem;cursor:pointer}
.popup-meta{color:var(--muted);margin:.15rem 0}
.popup-detour{font-size:1.1rem;font-weight:700;color:#ffe08a;margin:.35rem 0}
.popup-trailer,.popup-range{font-size:1.05rem;font-weight:700;margin:.35rem 0}
.popup-trailer.yes,.popup-range.ok{color:#7dffa8} .popup-trailer.maybe,.popup-range.tight{color:#ffe08a} .popup-trailer.no,.popup-range.oor{color:#ffb4b4}
.popup-links{display:grid;grid-template-columns:1fr;gap:.45rem;margin:.65rem 0 .35rem}
.popup-links a{display:block;width:100%;text-align:center;font-weight:700;font-size:1.05rem;padding:.75rem;border-radius:10px;border:2px solid var(--border);text-decoration:none;min-height:48px;color:#fff}
.popup-links a.streetview{background:#2a5f8f;border-color:#1e4a70}
.popup-links a.directions{background:#3d5a40;border-color:#2d4530}
.popup-actions{display:grid;grid-template-columns:1fr;gap:.45rem;margin-top:.75rem}
.popup-actions button{width:100%;font-weight:700;font-size:1.05rem;padding:.7rem}
.notes-box{margin-top:.75rem;border-top:2px solid var(--border);padding-top:.65rem}
.notes-box label{font-weight:700;display:block;margin-bottom:.35rem}
.notes-box textarea{width:100%;min-height:88px;background:#0f1419;color:var(--text);border:2px solid var(--border);border-radius:10px;padding:.55rem;resize:vertical}
.notes-box .photo-row{display:flex;flex-wrap:wrap;gap:.5rem;align-items:center;margin-top:.5rem}
.notes-box img{max-width:100%;border-radius:10px;border:2px solid var(--border);margin-top:.45rem}
#modal-backdrop{display:none;position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:2000;align-items:center;justify-content:center;padding:1rem}
#modal-backdrop.open{display:flex}
#modal{background:var(--panel);border:2px solid var(--border);border-radius:var(--radius);max-width:520px;width:100%;padding:1rem 1.1rem;max-height:85vh;overflow:auto}
#modal h2{margin:0 0 .5rem;font-size:1.25rem} #modal p{color:var(--muted);margin:.4rem 0}
#modal input[type=text]{width:100%;background:#0f1419;color:var(--text);border:2px solid var(--border);border-radius:8px;padding:.6rem;margin:.4rem 0 .7rem}
#modal .row{display:flex;flex-wrap:wrap;gap:.5rem;margin-top:.5rem}
.leaflet-marker-icon.marker-wrap{pointer-events:auto;background:transparent!important;border:none!important}
.leaflet-marker-icon.marker-wrap *{pointer-events:none}
.badge{width:44px;height:44px;border-radius:50%;background:var(--fill,#2f6fed);border:2px solid #111;box-shadow:0 2px 6px rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;position:relative;flex:0 0 auto}
.badge .logo{width:26px;height:26px;background-color:var(--ink,#000);-webkit-mask-position:center;mask-position:center;-webkit-mask-repeat:no-repeat;mask-repeat:no-repeat;-webkit-mask-size:contain;mask-size:contain}
.badge .mono{font-weight:700;font-size:13px;line-height:1;color:var(--ink,#000)}
.badge .note-dot{position:absolute;right:-2px;top:-2px;width:12px;height:12px;border-radius:50%;background:#ffd166;border:2px solid #111}
.badge.badge-dot{background:transparent;border:none;box-shadow:none}
.badge.badge-dot::before{content:"";width:14px;height:14px;border-radius:50%;background:var(--fill,#1f9d55);border:2px solid #111;box-shadow:0 1px 3px rgba(0,0,0,.5)}
.badge.badge-dot .note-dot{right:12px;top:12px;width:10px;height:10px}
.popup-actions button,.leaflet-popup-content button{min-height:44px;touch-action:manipulation}
.toast-copy{position:fixed;left:50%;bottom:5.5rem;transform:translateX(-50%);background:#243044;color:var(--text);border:2px solid var(--border);padding:.55rem .9rem;border-radius:10px;z-index:3000;font-weight:700;display:none}
.toast-copy.show{display:block}
@media(max-width:820px){#main{flex-direction:column}#detour-panel{width:100%;max-height:70dvh;border-left:none;border-top:2px solid var(--border)}}
.marker-cluster-small,.marker-cluster-medium,.marker-cluster-large{background-clip:padding-box;background-color:rgba(90,104,122,.45)}
.marker-cluster-small div,.marker-cluster-medium div,.marker-cluster-large div{background-color:#3c4754;color:#fff;font-weight:700;width:34px;height:34px;margin-left:5px;margin-top:5px}
.marker-cluster span{line-height:34px}

</style>
</head>
<body>
<div id="topbar">
  <h1>DC chargers 50 kW+ · Canada &amp; US</h1>
  <button type="button" id="btn-locate" class="primary">Locate me</button>
  <button type="button" id="btn-settings">Range settings</button>
  <button type="button" id="btn-refresh">Refresh data</button>
  <button type="button" id="btn-export">Export</button>
  <button type="button" id="btn-import">Import</button>
  <button type="button" id="btn-a-minus">A-</button>
  <button type="button" id="btn-a-plus">A+</button>
  <span class="grow"></span>
  <span id="status">Loading…</span>
</div>
<div id="settings" aria-label="Range settings">
  <div class="field"><label for="set-kwh">Usable battery (kWh)</label><input type="number" id="set-kwh" min="10" max="200" step="1"></div>
  <div class="field"><label for="set-pct">Current battery %</label><input type="number" id="set-pct" min="1" max="100" step="1"></div>
  <div class="field"><label for="set-cons">kWh/100 km (no trailer)</label><input type="number" id="set-cons" min="5" max="80" step="0.5"></div>
  <div class="field"><label for="set-cons-tow">kWh/100 km (with trailer)</label><input type="number" id="set-cons-tow" min="5" max="100" step="0.5"></div>
  <div class="field"><label for="set-reserve">Arrive with reserve %</label><input type="number" id="set-reserve" min="0" max="40" step="1"></div>
  <label class="toggle"><input type="checkbox" id="set-towing"> Towing trailer</label>
  <button type="button" id="btn-settings-save" class="primary">Save settings</button>
  <button type="button" id="btn-settings-close">Close</button>
</div>
<div id="searchbar">
  <input type="text" id="dest-input" placeholder="Search destination address" autocomplete="street-address" enterkeyhint="search">
  <button type="button" id="btn-route" class="primary">Route</button>
  <button type="button" id="btn-clear-route" disabled>Clear route</button>
  <label for="corridor-km">Near route</label>
  <select id="corridor-km"><option value="2">2 km</option><option value="5" selected>5 km</option><option value="10">10 km</option><option value="20">20 km</option></select>
  <a id="btn-google-dir" href="#" target="_blank" rel="noopener noreferrer" style="display:none;padding:.55rem .85rem;min-height:44px;border-radius:10px;background:#3d5a40;border:2px solid #2d4530;color:#fff;font-weight:700;text-decoration:none">Google Directions</a>
  <div id="route-summary"></div>
</div>
<div id="main">
  <div id="map-stage">
    <div id="pick-banner"></div>
    <div id="map" role="application" aria-label="Charger map"></div>
  </div>
  <aside id="detour-panel" aria-label="Chargers along route">
    <header>
      <h2>Chargers on the way</h2>
      <div id="detour-filters">
        <label class="swatch"><input type="checkbox" id="d-blue" checked><span class="dot blue"></span> Blue</label>
        <label class="swatch"><input type="checkbox" id="d-yellow" checked><span class="dot yellow"></span> Yellow</label>
        <label class="swatch"><input type="checkbox" id="d-green" checked><span class="dot green"></span> Green</label>
        <label class="swatch"><input type="checkbox" id="d-trailer-ok"> Trailer OK only</label>
        <label class="swatch"><input type="checkbox" id="d-reachable-only"> Reachable only</label>
      </div>
      <div id="detour-status" class="popup-meta"></div>
      <div id="range-status" class="popup-meta" style="font-weight:700;color:#cde4ff"></div>
    </header>
    <div id="detour-loading" style="display:none">Working out detours… this can take a few seconds.</div>
    <div id="detour-error" style="display:none"></div>
    <ul id="detour-list"></ul>
  </aside>
</div>
<div id="legend">
  <strong>Show:</strong>
  <label class="swatch"><input type="checkbox" id="f-blue" checked><span class="dot blue"></span> Blue = regular</label>
  <label class="swatch"><input type="checkbox" id="f-yellow" checked><span class="dot yellow"></span> Yellow = fits trailer</label>
  <label class="swatch"><input type="checkbox" id="f-green" checked><span class="dot green"></span> Green = trailer charger (your tag or a listed source)</label>
  <label class="swatch" for="f-country">Region
    <select id="f-country" style="min-height:36px;background:#0f1419;color:var(--text);border:2px solid var(--border);border-radius:10px;padding:.25rem .45rem">
      <option value="all">Canada &amp; US</option>
      <option value="CA">Canada only</option>
      <option value="US">United States only</option>
    </select>
  </label>
  <span id="counts"></span>
</div>
<div id="modal-backdrop" aria-hidden="true"><div id="modal" role="dialog" aria-labelledby="modal-title"><h2 id="modal-title">Info</h2><div id="modal-body"></div><div class="row"><button type="button" id="modal-close">Close</button></div></div></div>
<input type="file" id="import-file" accept="application/json,.json" hidden>
<div id="copy-toast" class="toast-copy" role="status" aria-live="polite">Address copied</div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>

const COLOR_KEY = 'chargerMap.colors.v1';
const FONT_KEY = 'chargerMap.fontPx';
const OCM_KEY = 'chargerMap.ocmApiKey';
const SETTINGS_KEY = 'chargerMap.settings.v1';
const NOTES_KEY = 'chargerMap.notes.v1';
const COLORS = { blue: '#2f6fed', yellow: '#e6b800', green: '#1f9d55' };
const OSRM = 'https://router.project-osrm.org';
const NOMINATIM = 'https://nominatim.openstreetmap.org/search';
const DEFAULT_SETTINGS = {
  usableKwh: 75,
  batteryPct: 90,
  consNoTrailer: 19,
  consTrailer: 35,
  towing: false,
  reservePct: 10
};

let map, markersLayer, soloLayer, markerById = new Map(), stationById = new Map();
let colorMigration = {applied:false, cleared:0, tags:0, ids:[]};
const MARKER_PX = 44;
const LOGO_ZOOM = 12;
const LISTED_GREEN_MIGRATE_KEY = 'chargerMap.listedGreenMigration.v1';
let colors = loadJSON(COLOR_KEY, {});
let notes = loadJSON(NOTES_KEY, {});
let settings = Object.assign({}, DEFAULT_SETTINGS, loadJSON(SETTINGS_KEY, {}));
let fontPx = Number(localStorage.getItem(FONT_KEY) || 18);
let routeLayer = null, startMarker = null, endMarker = null, youMarker = null, rangeMarker = null;
let routeState = null, pickMode = null, pendingDest = null;
let detourById = new Map();
const iconCache = new Map();
let dbPromise = null;

function loadJSON(key, fallback) {
  try { return Object.assign(Array.isArray(fallback) ? [] : {}, JSON.parse(localStorage.getItem(key) || 'null') || fallback); }
  catch { return fallback; }
}
function saveColors(){ localStorage.setItem(COLOR_KEY, JSON.stringify(colors)); }
function saveNotes(){ localStorage.setItem(NOTES_KEY, JSON.stringify(notes)); }
function saveSettings(){ localStorage.setItem(SETTINGS_KEY, JSON.stringify(settings)); }
function rebuildStationIndex(){
  stationById=new Map();
  for(const s of STATIONS) stationById.set(s.id,s);
}
function getStation(id){ return stationById.get(id)||STATIONS.find(s=>s.id===id); }
function isDataTrailer(s){ return !!(s&&s.trailerFriendly); }
function getColor(id){
  const c=colors[id];
  if(c==='yellow'||c==='green'||c==='blue') return c;
  if(isDataTrailer(getStation(id))) return 'green';
  return 'blue';
}
function setFont(px){ fontPx=Math.max(14,Math.min(28,px)); document.documentElement.style.setProperty('--base', fontPx+'px'); localStorage.setItem(FONT_KEY, String(fontPx)); }
function escapeHtml(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function formatMin(sec){ if(sec==null||!isFinite(sec)) return '—'; const m=Math.round(sec/60); return m<60? (m+' min') : (Math.floor(m/60)+' h '+(m%60)+' min'); }
function formatKm(m){ if(m==null||!isFinite(m)) return '—'; return (m/1000).toFixed(m>=100000?0:1)+' km'; }
function trailerInfo(id){
  const c=getColor(id);
  const s=getStation(id);
  const user=colors[id];
  if(c==='green'){
    if(user==='green') return {cls:'yes', text:'Trailer friendly: Yes (your tag)'};
    if(isDataTrailer(s)){
      const src=s.trailerFriendlySource||'listed source';
      const stalls=s.trailerFriendlyStalls?(' · '+s.trailerFriendlyStalls+' stall(s)'):'';
      return {cls:'yes', text:'Trailer friendly: Yes (source: '+src+stalls+')'};
    }
    return {cls:'yes', text:'Trailer friendly: Yes'};
  }
  if(c==='yellow') return {cls:'maybe', text:'Fits a trailer without unhitching'};
  return {cls:'no', text:'Trailer: not checked yet'};
}
function consumption(){ return settings.towing ? Number(settings.consTrailer) : Number(settings.consNoTrailer); }
function energyNowKwh(){ return Number(settings.usableKwh) * Number(settings.batteryPct) / 100; }
function reserveKwh(){ return Number(settings.usableKwh) * Number(settings.reservePct) / 100; }
function rangeToEmptyKm(){ const cons=consumption()/100; return cons>0 ? energyNowKwh()/cons : 0; }
function rangeToReserveKm(){ const cons=consumption()/100; const e=Math.max(0, energyNowKwh()-reserveKwh()); return cons>0 ? e/cons : 0; }
function arrivalPctAtKm(distKm){
  const used = distKm * (consumption()/100);
  return (energyNowKwh() - used) / Number(settings.usableKwh) * 100;
}
function rangeFlagForPct(pct){
  if(pct == null || !isFinite(pct) || pct < 0) return {cls:'oor', label:'Out of range', short:'Out of range'};
  if(pct < 15) return {cls:'tight', label:'Tight — about '+Math.round(pct)+'% on arrival', short:'Tight (~'+Math.round(pct)+'%)'};
  return {cls:'ok', label:'Reachable — about '+Math.round(pct)+'% on arrival', short:'Reachable (~'+Math.round(pct)+'%)'};
}
function noteFirstLine(id){

function openDB(){
  if(dbPromise) return dbPromise;
  dbPromise=new Promise((resolve,reject)=>{
    const req=indexedDB.open('chargerMap',1);
    req.onupgradeneeded=()=>{ const db=req.result; if(!db.objectStoreNames.contains('photos')) db.createObjectStore('photos'); };
    req.onsuccess=()=>resolve(req.result);
    req.onerror=()=>reject(req.error);
  });
  return dbPromise;
}
async function idbGetPhoto(id){
  const db=await openDB();
  return new Promise((resolve,reject)=>{
    const tx=db.transaction('photos','readonly');
    const req=tx.objectStore('photos').get(id);
    req.onsuccess=()=>resolve(req.result||null);
    req.onerror=()=>reject(req.error);
  });
}
async function idbSetPhoto(id, dataUrl){

}
async function idbDeletePhoto(id){

async function idbAllPhotos(){

  return new Promise((resolve,reject)=>{
    const tx=db.transaction('photos','readonly');
    const req=tx.objectStore('photos').openCursor();
    const out={};
    req.onsuccess=()=>{
      const cur=req.result;
      if(cur){ out[cur.key]=cur.value; cur.continue(); }
      else resolve(out);
    };
    req.onerror=()=>reject(req.error);
  });
}
function resizeImageToJpeg(file, maxDim=800, quality=0.82){
  return new Promise((resolve,reject)=>{
    const url=URL.createObjectURL(file);
    const img=new Image();
    img.onload=()=>{
      let w=img.width, h=img.height;
      const scale=Math.min(1, maxDim/Math.max(w,h));
      w=Math.round(w*scale); h=Math.round(h*scale);
      const canvas=document.createElement('canvas');
      canvas.width=w; canvas.height=h;
      const ctx=canvas.getContext('2d');
      ctx.drawImage(img,0,0,w,h);
      URL.revokeObjectURL(url);
      resolve(canvas.toDataURL('image/jpeg', quality));
    };
    img.onerror=()=>{ URL.revokeObjectURL(url); reject(new Error('Could not read photo')); };
    img.src=url;
  });
}

function networkKey(network){
  const n=(network||'').toLowerCase();
  if(n.includes('circuit')) return 'circuit';
  if(n.includes('flo')) return 'flo';
  if(n.includes('tesla')) return 'tesla';
  if(n.includes('chargepoint')||n.includes('charge point')) return 'chargepoint';
  if(n.includes('electrify')) return 'electrify';
  if(n.includes('petro')) return 'petro';
  if(n.includes('ivy')) return 'ivy';
  if(n.includes('circle')||n.includes('couche')) return 'circlek';
  if(n.includes('shell')) return 'shell';
  if(n.includes('ev connect')||n.includes('evconnect')) return 'evconnect';
  if(n.includes('jule')) return 'jule';
  if(n.includes('swtch')) return 'swtch';
  if(n.includes('irving')) return 'irving';
  return null;
}
function monogramFor(network){
  const n=(network||'').trim();
  if(!n||/unknown/i.test(n)) return 'EV';
  const key=networkKey(n);
  const map={circuit:'CE',flo:'FLO',tesla:'T',chargepoint:'CP',electrify:'EC',petro:'PC',ivy:'IVY',circlek:'CK',shell:'SH',evconnect:'EVC',jule:'JUL',swtch:'SW',irving:'IR'};
  if(key&&map[key]) return map[key];
  const parts=n.replace(/[()]/g,'').split(/\s+/).filter(Boolean);
  if(parts.length===1) return parts[0].slice(0,3).toUpperCase();
  return (parts[0][0]+(parts[1]?.[0]||'')).toUpperCase();
}
function srgbChannel(value){
  const x=value/255;
  return x<=0.04045 ? x/12.92 : Math.pow((x+0.055)/1.055, 2.4);
}
function relativeLuminance(hex){
  const raw=String(hex||'').replace('#','').trim();
  const full=raw.length===3 ? raw.split('').map(ch=>ch+ch).join('') : raw;
  const r=parseInt(full.slice(0,2),16);
  const g=parseInt(full.slice(2,4),16);
  const b=parseInt(full.slice(4,6),16);
  return 0.2126*srgbChannel(r)+0.7152*srgbChannel(g)+0.0722*srgbChannel(b);
}
function contrastRatio(a,b){
  const hi=Math.max(a,b), lo=Math.min(a,b);
  return (hi+0.05)/(lo+0.05);
}
function inkForFill(hex){
  const L=relativeLuminance(hex);
  const onWhite=contrastRatio(L, 1);
  const onBlack=contrastRatio(L, 0);
  return onWhite>onBlack ? '#ffffff' : '#000000';
}
function logoHtml(network, colorName, withNote){
  const fill=COLORS[colorName]||COLORS.blue;
  const ink=inkForFill(fill);
  const key=networkKey(network);
  const mask=key && LOGO_MASKS[key];
  const note=withNote?'<span class="note-dot" title="Has notes"></span>':'';
  if(mask) return `<div class="badge" style="--fill:${fill};--ink:${ink}">${note}<div class="logo" style="background-color:${ink};-webkit-mask-image:url('${mask}');mask-image:url('${mask}');"></div></div>`;
  return `<div class="badge" style="--fill:${fill};--ink:${ink}">${note}<span class="mono" style="color:${ink}">${escapeHtml(monogramFor(network))}</span></div>`;
}
function dotHtml(colorName, withNote){

function markerIsDot(colorName, zoom){

}
function pinIcon(network, colorName, withNote, zoom){
  const z=zoom==null ? (map&&map.getZoom?map.getZoom():LOGO_ZOOM) : zoom;
  const dot=markerIsDot(colorName, z);
  const cacheKey=(networkKey(network)||monogramFor(network))+'|'+colorName+'|'+(withNote?1:0)+'|'+(dot?'dot':'logo');
  if(iconCache.has(cacheKey)) return iconCache.get(cacheKey);
  const html=dot ? dotHtml(colorName, withNote) : logoHtml(network, colorName, withNote);
  const icon=L.divIcon({className:'marker-wrap', html, iconSize:[MARKER_PX,MARKER_PX], iconAnchor:[MARKER_PX/2,MARKER_PX/2], popupAnchor:[0,-MARKER_PX/2]});
  iconCache.set(cacheKey, icon);
  return icon;
}
function armMarkerTap(marker){
  const icon=marker&&marker.getElement&&marker.getElement();
  if(!icon||icon._evTrailerTap) return;
  icon._evTrailerTap=true;
  const isCluster=icon.classList.contains('marker-cluster');
  let start=null;
  L.DomEvent.on(icon, 'touchstart', function(e){
    L.DomEvent.stopPropagation(e);
    const t=e.touches&&e.touches[0];
    start=t?{x:t.clientX,y:t.clientY}:null;
  });
  L.DomEvent.on(icon, 'mousedown', L.DomEvent.stopPropagation);
  if(isCluster) return;
  L.DomEvent.on(icon, 'click', function(e){
    L.DomEvent.stopPropagation(e);
    L.DomEvent.preventDefault(e);
    if(icon._suppressClick) return;
    if(!(marker.getPopup&&marker.getPopup())) return;
    if(marker.isPopupOpen&&marker.isPopupOpen()) marker.closePopup();
    else marker.openPopup();
  });
  L.DomEvent.on(icon, 'touchend', function(e){
    const t=e.changedTouches&&e.changedTouches[0];
    if(start&&t && Math.abs(t.clientX-start.x)+Math.abs(t.clientY-start.y)>28) return;
    if(!(marker.getPopup&&marker.getPopup())) return;
    // The synthetic click that follows a tap would reach the map and close the popup.
    L.DomEvent.preventDefault(e);
    L.DomEvent.stopPropagation(e);
    icon._suppressClick=true;
    setTimeout(function(){ icon._suppressClick=false; }, 700);
    if(marker.isPopupOpen&&marker.isPopupOpen()) marker.closePopup();
    else marker.openPopup();
  });
}
function paintMarker(marker, station, colorName){
  marker.setIcon(pinIcon(station.network, colorName, hasNote(station.id)));
  armMarkerTap(marker);
}

function haversineM(aLat,aLon,bLat,bLon){
  const R=6371000, toR=d=>d*Math.PI/180;
  const dLat=toR(bLat-aLat), dLon=toR(bLon-aLon);
  const x=Math.sin(dLat/2)**2+Math.cos(toR(aLat))*Math.cos(toR(bLat))*Math.sin(dLon/2)**2;
  return 2*R*Math.asin(Math.sqrt(x));
}
function normName(s){ return String(s||'').toLowerCase().replace(/[^a-z0-9]+/g,' ').replace(/\b(brcc|the|a|an)\b/g,'').replace(/\s+/g,' ').trim(); }
function normAddr(s){ return String(s||'').toLowerCase().replace(/[^a-z0-9]+/g,' ').replace(/\s+/g,' ').trim(); }
function nameSimilar(a,b){
  const na=normName(a), nb=normName(b);
  if(!na||!nb) return false;
  if(na===nb) return true;
  if(na.length>=8&&nb.length>=8&&(na.includes(nb)||nb.includes(na))) return true;
  const ta=new Set(na.split(' ')), tb=new Set(nb.split(' '));
  let inter=0; for(const t of ta) if(tb.has(t)) inter++;
  return inter/new Set([...ta,...tb]).size>=0.75;
}
function completeness(s){ return (s.address||'').length+(s.city?10:0)+(s.network&&!/unknown/i.test(s.network)?5:0); }
function shouldMerge(a,b){
  if(haversineM(a.lat,a.lon,b.lat,b.lon)>50) return false;
  const na=(a.network||'').trim().toLowerCase(), nb=(b.network||'').trim().toLowerCase();
  const sameNet=!na||!nb||na===nb||/unknown/.test(na)||/unknown/.test(nb);
  const similar=nameSimilar(a.name,b.name);
  const sameA=normAddr(a.address)&&normAddr(a.address)===normAddr(b.address);
  if(!(similar||sameA)) return false;
  if(!sameNet&&!similar) return false;
  return true;
}
function dedupeStations(list){
  const n=list.length, parent=Array.from({length:n},(_,i)=>i);
  const find=i=>{ while(parent[i]!==i){ parent[i]=parent[parent[i]]; i=parent[i]; } return i; };
  const uni=(i,j)=>{ const ri=find(i), rj=find(j); if(ri!==rj) parent[rj]=ri; };
  const CELL=0.0005, grid=new Map(), key=(gi,gj)=>gi+','+gj;
  list.forEach((s,i)=>{ const gi=Math.floor(s.lat/CELL), gj=Math.floor(s.lon/CELL); const k=key(gi,gj); if(!grid.has(k)) grid.set(k,[]); grid.get(k).push(i); });
  list.forEach((s,i)=>{
    const gi=Math.floor(s.lat/CELL), gj=Math.floor(s.lon/CELL);
    for(let di=-1;di<=1;di++) for(let dj=-1;dj<=1;dj++){
      for(const j of (grid.get(key(gi+di,gj+dj))||[])){ if(j<=i) continue; if(shouldMerge(list[i],list[j])) uni(i,j); }
    }
  });
  const clusters=new Map();
  for(let i=0;i<n;i++){ const r=find(i); if(!clusters.has(r)) clusters.set(r,[]); clusters.get(r).push(i); }
  const out=[];
  for(const idxs of clusters.values()){
    const group=idxs.map(i=>list[i]).sort((a,b)=>{
      const ma=String(a.id).match(/(\d+)/), mb=String(b.id).match(/(\d+)/);
      return ((ma?+ma[1]:1e15)-(mb?+mb[1]:1e15))||String(a.id).localeCompare(String(b.id));
    });
    const keep=Object.assign({}, group[0]); keep._mergedIds=[keep.id];
    for(let k=1;k<group.length;k++){
      const other=group[k];
      keep.kw=Math.max(+keep.kw||0,+other.kw||0);
      keep.ports=Math.max(+keep.ports||0,+other.ports||0);
      if(completeness(other)>completeness(keep)){ keep.address=other.address||keep.address; keep.city=other.city||keep.city; keep.name=other.name||keep.name; }
      if((!keep.network||/unknown/i.test(keep.network))&&other.network) keep.network=other.network;
      for(const mid of (other._mergedIds||[other.id])) if(!keep._mergedIds.includes(mid)) keep._mergedIds.push(mid);
    }
    out.push(keep);
  }
  return out;
}
function migrateColorsAfterDedupe(list){
  let changed=false;
  for(const s of list){
    const ids=s._mergedIds||[s.id];
    if(isDataTrailer(s)){
      for(const id of ids){
        if(id!==s.id && colors[id]==='yellow'){ delete colors[id]; changed=true; }
      }
    }
    let chosen=null;
    for(const id of ids){
      const c=colors[id];
      if(c!=='green'&&c!=='yellow') continue;
      if(isDataTrailer(s) && c==='yellow' && id!==s.id) continue;
      chosen=c;
      break;
    }
    if(!chosen) continue;
    if(colors[s.id]!==chosen){ colors[s.id]=chosen; changed=true; }
    for(const id of ids){ if(id!==s.id && colors[id]){ delete colors[id]; changed=true; } }
  }
  if(changed) saveColors();
}
function migrateListedGreenOverOldYellow(list){
  if(localStorage.getItem(LISTED_GREEN_MIGRATE_KEY)==='1') return {applied:false, cleared:0, tags:0, ids:[]};
  const ids=[];
  let cleared=0;
  for(const s of list){
    if(!isDataTrailer(s)) continue;
    const keys=s._mergedIds||[s.id];
    if(!keys.some(id=>colors[id]==='yellow')) continue;
    cleared++;
    for(const id of keys){
      if(colors[id]==='yellow'){ delete colors[id]; ids.push(id); }
    }
  }
  if(ids.length) saveColors();
  localStorage.setItem(LISTED_GREEN_MIGRATE_KEY,'1');
  return {applied:true, cleared, tags:ids.length, ids};
}

function visibleColor(c){ const el=document.getElementById('f-'+c); return !el||el.checked; }
function visibleCountry(code){
  const el=document.getElementById('f-country');
  const v=el?el.value:'all';
  return v==='all'||v===code;
}
function updateCounts(){
  const tallies={blue:0,yellow:0,green:0};
  for(const s of STATIONS) tallies[getColor(s.id)]++;
  const shown=[...markerById.values()].filter(m=>(markersLayer&&markersLayer.hasLayer(m))||(soloLayer&&soloLayer.hasLayer(m))).length;
  document.getElementById('counts').textContent=` · Showing ${shown} of ${STATIONS.length} · Blue ${tallies.blue} · Yellow ${tallies.yellow} · Green ${tallies.green}`;
  if(!routeState){
    const ca=STATIONS.filter(s=>s.country==='CA').length, us=STATIONS.filter(s=>s.country==='US').length;
    const listed=STATIONS.filter(s=>s.trailerFriendly&&colors[s.id]!=='blue'&&colors[s.id]!=='yellow').length;
    document.getElementById('status').textContent=`${STATIONS.length} stations · CA ${ca} · US ${us} · ${listed} listed trailer-friendly · snapshot ${META.fetched||''}`;
  }
}
function markerLayerFor(col){ return (col==='green'||col==='yellow') ? soloLayer : markersLayer; }
function detachMarker(m){
  if(markersLayer&&markersLayer.hasLayer(m)) markersLayer.removeLayer(m);
  if(soloLayer&&soloLayer.hasLayer(m)) soloLayer.removeLayer(m);
}
function attachMarker(m, col){
  detachMarker(m);
  markerLayerFor(col).addLayer(m);
}
function applyFilters(){
  for(const s of STATIONS){
    const m=markerById.get(s.id); if(!m) continue;
    const col=getColor(s.id), show=visibleColor(col)&&visibleCountry(s.country);
    if(!show){ detachMarker(m); continue; }
    const want=markerLayerFor(col);
    if(want.hasLayer(m)) continue;
    attachMarker(m, col);
  }
  updateCounts(); renderDetourList();
}
function recolourMarker(id){
  const m=markerById.get(id), s=getStation(id);
  if(!m||!s) return;
  const open=m.isPopupOpen&&m.isPopupOpen();
  const col=getColor(id);
  paintMarker(m, s, col);
  m.setPopupContent(popupHtml(s));
  applyFilters();
  if(open && m.openPopup) m.openPopup();
}
function refreshSoloIcons(){
  if(!map) return;
  const dot=map.getZoom()<LOGO_ZOOM;
  if(refreshSoloIcons._dot===dot) return;
  refreshSoloIcons._dot=dot;
  for(const s of STATIONS){
    const col=getColor(s.id);
    if(col!=='green'&&col!=='yellow') continue;
    const m=markerById.get(s.id);
    if(m) paintMarker(m, s, col);
  }
}
function buildMarkers(){
  markersLayer.clearLayers(); soloLayer.clearLayers(); markerById.clear(); iconCache.clear();
  const z=map.getZoom();
  for(const s of STATIONS){

function toRad(d){ return d*Math.PI/180; }
function nearestOnRoute(lat, lon, coordsLngLat){
  let best={distM:Infinity, alongM:0}; let along=0;
  for(let i=0;i<coordsLngLat.length-1;i++){
    const [aLon,aLat]=coordsLngLat[i], [bLon,bLat]=coordsLngLat[i+1];
    const segLen=haversineM(aLat,aLon,bLat,bLon);
    const lat0=toRad((aLat+bLat+lat)/3);
    const xP=toRad(lon-aLon)*Math.cos(lat0), yP=toRad(lat-aLat);
    const xB=toRad(bLon-aLon)*Math.cos(lat0), yB=toRad(bLat-aLat);
    const len2=xB*xB+yB*yB; let t=len2===0?0:(xP*xB+yP*yB)/len2; t=Math.max(0,Math.min(1,t));
    const nLat=aLat+(bLat-aLat)*t, nLon=aLon+(bLon-aLon)*t;
    const d=haversineM(lat,lon,nLat,nLon);
    if(d<best.distM) best={distM:d, alongM:along+segLen*t};
    along+=segLen;
  }
  return best;
}
function pointAlongRoute(coordsLngLat, targetM){
  let along=0;
  for(let i=0;i<coordsLngLat.length-1;i++){
    const [aLon,aLat]=coordsLngLat[i], [bLon,bLat]=coordsLngLat[i+1];
    const seg=haversineM(aLat,aLon,bLat,bLon);
    if(along+seg>=targetM){
      const t=seg===0?0:(targetM-along)/seg;
      return {lat:aLat+(bLat-aLat)*t, lon:aLon+(bLon-aLon)*t};
    }
    along+=seg;
  }
  const last=coordsLngLat[coordsLngLat.length-1];
  return {lat:last[1], lon:last[0]};
}
async function geocode(query){
  const res=await fetch(NOMINATIM+'?format=json&limit=1&q='+encodeURIComponent(query),{headers:{'Accept':'application/json'}});
  if(!res.ok) throw new Error('Address lookup failed ('+res.status+')');
  const data=await res.json();
  if(!data||!data.length) throw new Error('No match for that address');
  return {lat:+data[0].lat, lon:+data[0].lon, label:data[0].display_name};
}
function getCurrentPosition(){
  return new Promise((resolve,reject)=>{
    if(!navigator.geolocation){ reject(new Error('Geolocation is not available on this device.')); return; }
    navigator.geolocation.getCurrentPosition(
      pos=>resolve({lat:pos.coords.latitude, lon:pos.coords.longitude, label:'My location'}),
      err=>reject(err),
      {enableHighAccuracy:true, timeout:15000, maximumAge:60000}
    );
  });
}
async function fetchOsrmRoute(start,end){
  const url=`${OSRM}/route/v1/driving/${start.lon},${start.lat};${end.lon},${end.lat}?overview=full&geometries=geojson`;
  const res=await fetch(url); if(!res.ok) throw new Error('Routing server returned '+res.status);
  const data=await res.json();
  if(data.code!=='Ok'||!data.routes?.[0]) throw new Error(data.message||'No driving route found');
  const r=data.routes[0]; return {duration:r.duration, distance:r.distance, geometry:r.geometry};
}
async function fetchOsrmTable(coords, sources, destinations){
  const path=coords.map(c=>`${c.lon},${c.lat}`).join(';');
  const url=`${OSRM}/table/v1/driving/${path}?sources=${sources.join(';')}&destinations=${destinations.join(';')}&annotations=duration,distance`;
  const res=await fetch(url); if(!res.ok) throw new Error('Travel-time table failed ('+res.status+')');
  const data=await res.json(); if(data.code!=='Ok') throw new Error(data.message||'Travel-time table error');
  return data;
}

function stationsNearRoute(geometry, corridorKm){
  const coords=geometry.coordinates, maxM=corridorKm*1000, out=[];
  for(const s of STATIONS){
    const n=nearestOnRoute(s.lat,s.lon,coords);
    if(n.distM<=maxM) out.push({station:s, distToRouteM:n.distM, alongM:n.alongM});
  }
  return out;
}
async function computeDetours(start,end,directSec,nearList){
  const BATCH=90, results=[];
  for(let i=0;i<nearList.length;i+=BATCH){
    const chunk=nearList.slice(i,i+BATCH);
    const coords=[{lon:start.lon,lat:start.lat},{lon:end.lon,lat:end.lat}].concat(chunk.map(c=>({lon:c.station.lon,lat:c.station.lat})));
    const chargerIdx=chunk.map((_,j)=>j+2);
    const t1=await fetchOsrmTable(coords,[0],chargerIdx);
    const t2=await fetchOsrmTable(coords,chargerIdx,[1]);
    for(let j=0;j<chunk.length;j++){
      const toCharger=t1.durations[0][j], fromCharger=t2.durations[j][0];
      const toDist=(t1.distances && t1.distances[0]) ? t1.distances[0][j] : null;
      if(toCharger==null||fromCharger==null) continue;
      const via=toCharger+fromCharger;
      const distKm=(toDist!=null?toDist:chunk[j].alongM)/1000;
      const arrivalPct=arrivalPctAtKm(distKm);
      results.push({
        ...chunk[j],
        toChargerSec:toCharger, fromChargerSec:fromCharger, viaSec:via,
        addedSec:Math.max(0, via-directSec),
        toChargerM: toDist!=null?toDist:chunk[j].alongM,
        arrivalPct
      });
    }
  }
  results.sort((a,b)=>a.addedSec-b.addedSec||a.alongM-b.alongM);
  return results;
}
function renderDetourList(){
  const list=document.getElementById('detour-list');
  if(!routeState||!routeState.detours){ list.innerHTML=''; return; }
  const show={blue:document.getElementById('d-blue').checked, yellow:document.getElementById('d-yellow').checked, green:document.getElementById('d-green').checked};
  const trailerOnly=document.getElementById('d-trailer-ok').checked;
  const reachableOnly=document.getElementById('d-reachable-only').checked;
  const filtered=routeState.detours.filter(d=>{
    const col=getColor(d.station.id);
    if(!show[col]) return false;
    if(trailerOnly && col==='blue') return false;
    const rf=rangeFlagForPct(d.arrivalPct);
    if(reachableOnly && rf.cls==='oor') return false;
    return true;
  });
  document.getElementById('detour-status').textContent=`${filtered.length} of ${routeState.detours.length} within ${routeState.corridorKm} km · sorted by least added time`;
  const destPct=arrivalPctAtKm(routeState.directM/1000);
  const destFlag=rangeFlagForPct(destPct);
  document.getElementById('range-status').textContent=
    `Battery plan: start ${settings.batteryPct}% · ${consumption()} kWh/100 km · dest ~${Math.round(destPct)}% (${destFlag.short}) · empty in ~${rangeToEmptyKm().toFixed(0)} km`;
  list.innerHTML=filtered.map(d=>{
    const col=getColor(d.station.id); const tr=trailerInfo(d.station.id);
    const rf=rangeFlagForPct(d.arrivalPct);
    const addMin=Math.round(d.addedSec/60);
    const note=noteFirstLine(d.station.id);
    return `<li data-station-id="${escapeHtml(d.station.id)}">
      <div class="row1">${logoHtml(d.station.network, col, hasNote(d.station.id))}<span>${escapeHtml(d.station.name)}</span><span class="added">+${addMin} min</span></div>
      <div class="row2">${escapeHtml(d.station.kw)} kW · ${formatKm(d.alongM)} into trip · ${escapeHtml(d.station.network)}</div>
      <div class="range-flag ${rf.cls}">${escapeHtml(rf.short)}</div>
      <div class="trailer ${tr.cls}">${escapeHtml(tr.text)}</div>
      ${note?`<div class="note-line">Note: ${escapeHtml(note)}</div>`:''}
      <div class="row2">${escapeHtml(d.station.address)}</div>
    </li>`;
  }).join('');
}
async function analyzeRouteChargers(){
  if(!routeState) return;
  const panel=document.getElementById('detour-panel');
  const loading=document.getElementById('detour-loading');
  const err=document.getElementById('detour-error');
  panel.classList.add('show'); loading.style.display='block'; err.style.display='none'; err.textContent='';
  document.getElementById('detour-list').innerHTML='';
  document.getElementById('detour-status').textContent='Finding chargers near the route…';
  try{
    const corridorKm=Number(document.getElementById('corridor-km').value)||5;
    const near=stationsNearRoute(routeState.geometry, corridorKm);
    document.getElementById('detour-status').textContent=`Found ${near.length} chargers within ${corridorKm} km — computing detours…`;
    const detours=await computeDetours(routeState.start, routeState.end, routeState.directSec, near);
    routeState.detours=detours; routeState.corridorKm=corridorKm;
    detourById.clear(); for(const d of detours) detourById.set(d.station.id,d);
    loading.style.display='none'; renderDetourList(); updateRangeMarker();
  }catch(e){
    loading.style.display='none'; err.style.display='block';
    err.textContent='Could not compute detours: '+(e.message||e)+'. You can still use Google Directions.';
  }
}
async function routeFromTo(start,end){
  document.getElementById('status').textContent='Getting driving route…';
  document.getElementById('btn-route').disabled=true;
  try{
    const r=await fetchOsrmRoute(start,end);
    routeState={start,end,directSec:r.duration,directM:r.distance,geometry:r.geometry,detours:[],corridorKm:Number(document.getElementById('corridor-km').value)||5};
    showRouteOnMap(start,end,r.geometry,r.duration,r.distance);
    document.getElementById('status').textContent=`Route ready · ${formatKm(r.distance)} · ${formatMin(r.duration)}`;
    await analyzeRouteChargers();
  }catch(e){
    openModal('Routing',`<p>${escapeHtml(e.message||String(e))}</p>`);
    document.getElementById('status').textContent='Routing failed';
  }finally{ document.getElementById('btn-route').disabled=false; }
}

document.getElementById('import-file').onchange=async(e)=>{
  const file=e.target.files&&e.target.files[0]; e.target.value=''; if(!file) return;
  try{
    const data=JSON.parse(await file.text());
    // backward compatible: colours-only or {colors:{}}
    const incomingColors=data.colors || (data.version?null:data) || {};
    if(incomingColors && typeof incomingColors==='object' && !Array.isArray(incomingColors)){
      let n=0;
      // if looks like colour map (values blue/yellow/green) or old export
      const vals=Object.values(incomingColors);
      const looksLikeColors = vals.length===0 || vals.every(v=>v==='blue'||v==='yellow'||v==='green'||v==null);
      if(data.colors || looksLikeColors){
        for(const [id,col] of Object.entries(data.colors||incomingColors)){
          if(col==='yellow'||col==='green'){ colors[id]=col; n++; }
          else if(col==='blue'){ colors[id]='blue'; n++; }
        }
        saveColors();
      }
    }
    if(data.notes && typeof data.notes==='object'){ notes=data.notes; saveNotes(); }
    if(data.settings && typeof data.settings==='object'){ settings=Object.assign({}, DEFAULT_SETTINGS, data.settings); saveSettings(); fillSettingsForm(); }
    if(data.photos && typeof data.photos==='object'){
      for(const [id, dataUrl] of Object.entries(data.photos)){
        if(typeof dataUrl==='string' && dataUrl.startsWith('data:')) await idbSetPhoto(id, dataUrl);
      }
    }
    migrateColorsAfterDedupe(STATIONS);
    buildMarkers();
    if(routeState){ for(const d of routeState.detours||[]){ d.arrivalPct=arrivalPctAtKm((d.toChargerM!=null?d.toChargerM:d.alongM)/1000); } renderDetourList(); updateRangeMarker(); }
    openModal('Import','<p>Import finished. Colours, notes, settings and photos were merged when present. Old colours-only files still work.</p>');
  }catch(err){ openModal('Import',`<p>Could not import: ${escapeHtml(err.message)}</p>`); }
};

function replaceStations(next){
  const deduped=dedupeStations(next);
  STATIONS.length=0; STATIONS.push(...deduped);
  rebuildStationIndex();
  migrateColorsAfterDedupe(STATIONS);
  buildMarkers();
  return {before:next.length, after:deduped.length};
}
async function refreshFromOcm(apiKey){
  const countries=['CA','US'];
  const pois=[];
  for(const cc of countries){
    const url='https://api.openchargemap.io/v3/poi/?output=json&countrycode='+cc+'&maxresults=100000&compact=true&verbose=false&key='+encodeURIComponent(apiKey);
    const res=await fetch(url); if(!res.ok) throw new Error('OCM HTTP '+res.status+' for '+cc);
    const batch=await res.json();
    for(const poi of batch) poi._country=cc;
    pois.push(...batch);
  }
  const CA_PROV={quebec:'QC','québec':'QC',qc:'QC',ontario:'ON',on:'ON','new brunswick':'NB','new-brunswick':'NB',nb:'NB','nova scotia':'NS',ns:'NS','prince edward island':'PE',pe:'PE',pei:'PE','newfoundland and labrador':'NL',newfoundland:'NL',nl:'NL',alberta:'AB',ab:'AB','british columbia':'BC',bc:'BC',manitoba:'MB',mb:'MB',saskatchewan:'SK',sk:'SK','northwest territories':'NT',nt:'NT',nunavut:'NU',nu:'NU',yukon:'YT',yt:'YT'};
  const US_PROV={alabama:'AL',alaska:'AK',arizona:'AZ',arkansas:'AR',california:'CA',colorado:'CO',connecticut:'CT',delaware:'DE','district of columbia':'DC',florida:'FL',georgia:'GA',hawaii:'HI',idaho:'ID',illinois:'IL',indiana:'IN',iowa:'IA',kansas:'KS',kentucky:'KY',louisiana:'LA',maine:'ME',maryland:'MD',massachusetts:'MA',michigan:'MI',minnesota:'MN',mississippi:'MS',missouri:'MO',montana:'MT',nebraska:'NE',nevada:'NV','new hampshire':'NH','new jersey':'NJ','new mexico':'NM','new york':'NY','north carolina':'NC','north dakota':'ND',ohio:'OH',oklahoma:'OK',oregon:'OR',pennsylvania:'PA','rhode island':'RI','south carolina':'SC','south dakota':'SD',tennessee:'TN',texas:'TX',utah:'UT',vermont:'VT',virginia:'VA',washington:'WA','west virginia':'WV',wisconsin:'WI',wyoming:'WY','puerto rico':'PR'};
  const CA_CODES=new Set(['QC','ON','NB','NS','PE','NL','AB','BC','MB','SK','NT','NU','YT']);
  const US_CODES=new Set(['AL','AK','AZ','AR','CA','CO','CT','DE','DC','FL','GA','HI','ID','IL','IN','IA','KS','KY','LA','ME','MD','MA','MI','MN','MS','MO','MT','NE','NV','NH','NJ','NM','NY','NC','ND','OH','OK','OR','PA','RI','SC','SD','TN','TX','UT','VT','VA','WA','WV','WI','WY','PR','GU','VI','AS','MP']);
  const bad=new Set([100,150,200,210]); const publicU=new Set([0,1,4,5,7]); const dcConn=new Set([2,27,30,32,33,1040]);
  function normProv(raw, country){
    const p=(raw||'').trim(); if(!p) return null;
    const codes=country==='CA'?CA_CODES:US_CODES;
    if(codes.has(p.toUpperCase())) return p.toUpperCase();
    const key=p.toLowerCase();
    const map=country==='CA'?CA_PROV:US_PROV;
    return map[key]||null;
  }
  const next=[];
  for(const poi of pois){
    if(bad.has(poi.StatusTypeID)) continue;
    if(poi.UsageTypeID!=null && !publicU.has(poi.UsageTypeID)) continue;
    const a=poi.AddressInfo||{};
    const country=poi._country==='US'?'US':'CA';
    const p=normProv(a.StateOrProvince, country);
    if(!p) continue;
    let ports=0,maxKw=0;
    for(const c of (poi.Connections||[])){
      const kw=c.PowerKW||0;
      const isDc=c.CurrentTypeID===30||c.LevelID===3||(dcConn.has(c.ConnectionTypeID)&&kw>=40);
      if(!isDc||kw<50) continue; ports+=(c.Quantity||1); if(kw>maxKw) maxKw=kw;
    }
    if(!ports||maxKw<50||a.Latitude==null||a.Longitude==null) continue;
    next.push({id:'ocm-'+poi.ID, name:a.Title||('OCM-'+poi.ID), network:String(poi.OperatorID||'Unknown'), address:[a.AddressLine1,a.Town,p,a.Postcode].filter(Boolean).join(', '), city:a.Town||'', prov:p, country, lat:+a.Latitude, lon:+a.Longitude, kw:+maxKw, ports:+ports});
  }
  const r=replaceStations(next);
  document.getElementById('status').textContent=`Refreshed OCM · ${r.after} after dedupe`;
  return r.after;
}
async function refreshFromCircuitElectrique(){
  const res=await fetch('https://data.lecircuitelectrique.com/stations/export_sites_fr.csv');
  if(!res.ok) throw new Error('Circuit électrique CSV HTTP '+res.status);
  const text=await res.text(); const lines=text.split(/\r?\n/); const header=lines.shift();
  function parseRow(line){ const out=[]; let cur='', q=false; for(let i=0;i<line.length;i++){ const ch=line[i]; if(ch==='"'){q=!q;continue;} if(ch===','&&!q){out.push(cur);cur='';continue;} cur+=ch;} out.push(cur); return out; }
  const cols=parseRow(header); const idx=Object.fromEntries(cols.map((c,i)=>[c.replace(/^\uFEFF/,''),i]));
  const parks=new Map();
  for(const line of lines){
    if(!line.trim()) continue; const r=parseRow(line);
    const kw=parseFloat((r[idx['Puissance (kW)']]||'0').replace(',','.')); if(!(kw>=50)) continue;
    const name=r[idx['Nom du parc']]||r[idx['Nom de la borne de recharge']];
    const lat=parseFloat(r[idx['Latitude']]), lon=parseFloat(r[idx['Longitude']]);
    if(!name||Number.isNaN(lat)||Number.isNaN(lon)) continue;
    const id='ce-'+name.toLowerCase().replace(/[^a-z0-9]+/g,'-').slice(0,80);
    const prev=parks.get(id)||{id,name,network:'Circuit électrique',address:'',city:'',prov:'QC',lat,lon,kw:0,ports:0};
    prev.kw=Math.max(prev.kw,kw); prev.ports+=1; prev.city=r[idx['Ville']]||prev.city;
    prev.address=[r[idx['Rue']]||r[idx['Adresse']],prev.city,'QC',r[idx['Code Postal']]].filter(Boolean).join(', ');
    prev.lat=lat; prev.lon=lon; parks.set(id,prev);
  }
  const kept=STATIONS.filter(s=>!/circuit/i.test(s.network));
  const r=replaceStations(kept.concat([...parks.values()]));
  document.getElementById('status').textContent=`Refreshed CE merge · ${r.after} after dedupe`;
  return r.after;
}

async function loadStations(){
  const res=await fetch(STATIONS_URL, {cache:'no-cache'});
  if(!res.ok) throw new Error('Could not load '+STATIONS_URL+' (HTTP '+res.status+'). Open this folder over http, not as a local file.');
  const data=await res.json();
  META=data.meta||{};
  const list=data.stations||[];
  if(!Array.isArray(list) || !list.length) throw new Error('Station list was empty.');
  STATIONS=list;
  rebuildStationIndex();
  return data;
}

const __chargerMapReady=loadStations().then((data)=>{
  migrateColorsAfterDedupe(STATIONS);
  colorMigration=migrateListedGreenOverOldYellow(STATIONS);
  initMap();
  if(colorMigration.applied && colorMigration.cleared){
    openModal('Colour tags updated', `<p>${colorMigration.cleared} saved yellow tag${colorMigration.cleared===1?'':'s'} on listed trailer-friendly chargers ${colorMigration.cleared===1?'was':'were'} cleared, so those chargers are green again. Notes were not changed. You can still tag a charger yellow yourself.</p>`);
  }
  const got=STATIONS.length;
  const expected=(data.stats&&data.stats.after)||got;
  if(got!==expected) console.warn('Station count '+got+' !== stats.after '+expected);
  return {got, expected, meta:META};
}).catch((err)=>{
  document.getElementById('status').textContent='Failed to load stations';
  openModal('Could not load stations', `<p>${escapeHtml(err.message||String(err))}</p><p>This North America map keeps the station list in <strong>stations-na.json</strong> (~4.3 MB) so the HTML stays small enough for a phone. Serve the folder with a local web server, or put both files on GitHub Pages. Opening the HTML as a file usually blocks the load.</p>`);
  throw err;
});
